name: 🔗 GHA
on: [push, pull_request]

permissions:
  contents: write

concurrency:
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-runner
  cancel-in-progress: true

jobs:
  # android-build:
  #   name: 🤖 Android
  #   uses: ./.github/workflows/android_builds.yml
  # 
  # ios-build:
  #   name: 🍏 iOS
  #   uses: ./.github/workflows/ios_builds.yml
  # 
  # javascript-build:
  #   name: 🌐 JavaScript
  #   uses: ./.github/workflows/javascript_builds.yml
  
  linux-build:
    name: 🐧 Linux
    uses: ./.github/workflows/linux_builds.yml

  # macos-build:
  #   name: 🍎 macOS
  #   uses: ./.github/workflows/macos_builds.yml
  # 
  # server-build:
  #   name: ☁ Server
  #   uses: ./.github/workflows/server_builds.yml

  windows-build:
    name: 🏁 Windows
    uses: ./.github/workflows/windows_builds.yml

  release:
    name: 🚀 Publish Release
    needs: [linux-build, windows-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts into clean zips
        shell: bash
        run: |
          mkdir -p dist
          cd artifacts
          
          # Loop through each artifact folder (windows-editor, linux-editor-mono, etc.)
          for dir in */; do
            dir_name="${dir%/}"
            echo "Zipping $dir_name..."
            (cd "$dir_name" && zip -r "../../dist/godot-$dir_name.zip" ./*)
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

